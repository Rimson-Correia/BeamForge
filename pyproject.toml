[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beamforge"
version = "0.1.0.dev0"
description = "Profile-aware laser parameters on target: spot size, energy, fluence, intensity."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rimson Correia" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/Rimson-Correia/BeamForge"

[project.optional-dependencies]
gui = ["PySide6>=6.5", "pyqtgraph>=0.13"]
dev = ["pytest>=7", "ruff>=0.4"]
build = ["pyinstaller>=6"]

[project.scripts]
beamforge = "beamforge.cli:main"

[project.gui-scripts]
beamforge-gui = "beamforge.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/beamforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
